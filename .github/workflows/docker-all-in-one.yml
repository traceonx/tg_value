name: Publish single-container NAS image
on:
  push:
    branches: [docker-hub]
  pull_request:
    branches: [main, docker-hub]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nas-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: backend
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
      - run: bash -n deploy/all-in-one-entrypoint.sh deploy/test-all-in-one.sh
      - run: TG_VAULT_IMAGE=example/tg-vault:test docker compose -f deploy/nas/compose.yaml config --quiet

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build native image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: tg-vault:test
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_VERSION=${{ github.ref_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=nas-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nas-${{ matrix.arch }}
      - name: Test startup, persistence and process supervision
        run: bash deploy/test-all-in-one.sh
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docker-hub'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docker-hub'
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/tg-vault
          REVISION: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag tg-vault:test "$IMAGE:$REVISION-$ARCH"
          docker push "$IMAGE:$REVISION-$ARCH"

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docker-hub'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish multi-platform tags
        timeout-minutes: 10
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/tg-vault
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if (( attempt == 4 )); then
                echo "::error::Docker Hub operation failed after 4 attempts"
                return 1
              fi
              echo "::warning::Docker Hub operation failed; retrying in $((attempt * 10)) seconds"
              sleep "$((attempt * 10))"
            done
          }
          sources=("$IMAGE:$REVISION-amd64" "$IMAGE:$REVISION-arm64")
          retry docker buildx imagetools create \
            -t "$IMAGE:docker-hub" -t "$IMAGE:latest" -t "$IMAGE:$REVISION" \
            "${sources[@]}"
          retry docker buildx imagetools inspect "$IMAGE:$REVISION"
